<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazario</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}
header{
background:#0d6efd;
color:white;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}
.search{
padding:15px;
text-align:center;
}
.search input{
width:90%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}
.banner{
background:orange;
color:white;
padding:40px;
text-align:center;
font-size:30px;
font-weight:bold;
}
.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:15px;
}
.card{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}
button{
background:#0d6efd;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
}
footer{
background:#222;
color:white;
text-align:center;
padding:15px;
margin-top:20px;
}
</style>
</head>
<body>

<header>🛒 BAZARIO</header>

<div class="search">
<input type="text" placeholder="Search Products...">
</div>

<div class="banner">
Mega Sale 50% OFF
</div>

<div class="categories">
<div class="card">👕 Men's Fashion</div>
<div class="card">👗 Women's Fashion</div>
<div class="card">🥜 Dry Fruits</div>
<div class="card">🏠 Home & Kitchen</div>
</div>

<div style="text-align:center;padding:20px;">
<button>Shop Now</button>
</div>

<footer>
© 2026 Bazario | Shop Smart
</footer>

</body>
</html>
