

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bazario Seller Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="seller-dashboard">

<div class="sidebar">
<h2>🛒 BAZARIO</h2>

<a href="#">🏠 Dashboard</a>
<a href="#">📦 Products</a>
<a href="#">🛍 Orders</a>
<a href="#">💰 Earnings</a>
<a href="#">👤 Profile</a>
<a href="#">🚪 Logout</a>
</div>

<div class="main-content">

<h1>Seller Dashboard</h1>

<div class="cards">

<div class="card">
<h3>Total Products</h3>
<p id="totalProducts">0</p>
</div>

<div class="card">
<h3>Total Orders</h3>
<p id="totalOrders">0</p>
</div>

<div class="card">
<h3>Total Sales</h3>
<p id="totalSales">₹0</p>
</div>

</div>

<h2>Add Product</h2>

<form id="productForm">

<input type="text" id="name" placeholder="Product Name" required><br><br>

<input type="number" id="price" placeholder="Price" required><br><br>

<input type="number" id="stock" placeholder="Stock" required><br><br>

<textarea id="description" placeholder="Description"></textarea><br><br>

<input type="file" id="image"><br><br>

<img id="preview" width="150" style="display:none;"><br><br>

<button type="submit">Upload Product</button>

</form>

<h2>Your Products</h2>

<div id="productList"></div>

</div>

</div>

<script type="module" src="Seller.js"></script>

</body>
</html>
