<!DOCTYPE html>
<html><input
    type="text"
    id="search"
    placeholder="Search Products..."
    onkeyup="searchProducts()">
<head>
<title>Product Details</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Wireless Headphones</h1>

<a href="product.html">
  <img src="https://picsum.photos/200" alt="Wireless Headphones">
</a>

<h2>$49.99</h2>

<p>High quality wireless headphones with deep bass and long battery life.</p>

<button>Buy Now</button>
<script src="script.js"></script>
</body>
</html>
<button onclick="addToCart('${product.name}', ${product.price})">
    Add to Cart
</button><button onclick="addToWishlist('${product.name}', ${product.price}, '${product.image}')">
    ❤️ Wishlist
</button>
<p>
⭐ ⭐ ⭐ ⭐ ⭐
</p>

<select onchange="rateProduct('${product.name}', this.value)">
    <option value="">Rate</option>
    <option value="1">1 Star</option>
    <option value="2">2 Stars</option>
    <option value="3">3 Stars</option>
    <option value="4">4 Stars</option>
    <option value="5">5 Stars</option>
</select>
<p>Rating: ${JSON.parse(localStorage.getItem("ratings") || "{}")[product.name] || "No Rating"} ⭐</p>
